name: wordify
version: 0.7.0.0
github: "happy0/wordify"
license: BSD3
author: "Gordon Martin"
maintainer: "happy0"
copyright: "2019 Gordon Martin"

extra-source-files:
  - README.md
  - ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
category: Game

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/githubuser/wordify#readme>

dependencies:
  - base >= 4.7 && < 5
  - containers >= 0.6 && < 0.9
  - array >= 0.5 && < 0.6
  - random >= 1.2 && < 1.4
  - mtl >= 2.2 && < 2.4
  - transformers >= 0.5 && < 0.7
  - parsec >= 3.1 && < 3.2
  - unordered-containers >= 0.2 && < 0.3
  - semigroups >= 0.18 && < 0.21
  - errors >= 2.3 && < 2.4
  - listsafe >= 0.1 && < 0.2
  - safe >= 0.3 && < 0.4
  - split >= 0.2 && < 0.3
  - text >= 1.2 && < 2.2
  - conduit >= 1.3 && < 1.4
  - bytestring >= 0.10 && < 0.13

library:
  source-dirs: src

executables:
  wordify-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - wordify

tests:
  wordify-test:
    main: Main.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - wordify
      - QuickCheck >= 2.14 && < 2.19
      - HUnit >= 1.6 && < 1.7
      - test-framework >= 0.8 && < 0.9
      - test-framework-hunit >= 0.3 && < 0.4
      - test-framework-quickcheck2 >= 0.3 && < 0.4
      - directory >= 1.3 && < 1.4
      - containers >= 0.6 && < 0.9
      - random >= 1.2 && < 1.4
      - semigroups >= 0.18 && < 0.21
      - filepath >= 1.4 && < 1.6
